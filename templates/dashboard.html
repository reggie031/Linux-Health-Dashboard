<!DOCTYPE html>
<html>
    <p>Hostname: {{ stats.hostname }}</p>
<head>
    <title>Health Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<<body>

<div class="container mt-5">

    <h1 class="mb-4">System Health Dashboard</h1>

 <div class="card p-3 mb-3">

    <h3>CPU Usage</h3>

    {% if stats.cpu > 80 %}
        <p class="text-danger">{{ stats.cpu }}%</p>
    {% else %}
        <p class="text-success">{{ stats.cpu }}%</p>
    {% endif %}

</div>

    <div class="card p-3 mb-3">
        <h3>Memory Usage</h3>
        <p>{{ stats.memory }}%</p>
    </div>

    <div class="card p-3 mb-3">
        <h3>Disk Usage</h3>
        <p>{{ stats.disk }}%</p>
    </div>

    <div class="card p-3 mb-3">
        <h3>System Uptime</h3>
        <p>{{ stats.uptime_hours }} hours</p>
    </div>

</div>

</body>

</body>
</html>
